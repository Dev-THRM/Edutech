<!DOCTYPE html>
<html>
<body>
<canvas id="canvas"></canvas>
<script>
  const img = new Image();
  img.crossOrigin = "Anonymous";
  img.onload = () => {
    const canvas = document.getElementById('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      
      // If pixel is white or near-white (background of logo)
      if (r > 220 && g > 220 && b > 220) {
        data[i + 3] = 0; // Make fully transparent
      } else if (r > 190 && g > 190 && b > 190) {
        // Feather/smooth edge alpha transition
        const alpha = Math.max(0, 255 - ((r + g + b) / 3 - 190) * 8);
        data[i + 3] = Math.min(data[i + 3], alpha);
      }
    }

    ctx.putImageData(imgData, 0, 0);

    const link = document.createElement('a');
    link.download = 'logo_transparent.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  };
  img.src = 'logo.webp';
</script>
</body>
</html>
